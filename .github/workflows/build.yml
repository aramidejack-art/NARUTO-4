name: Build ShinobiCraft

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project root
        id: root
        run: |
          # Prefer repo root if it already looks like the Forge project
          if [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "Using repo root"
          elif [ -f ShinobiCraft-Forge-1.20.1/build.gradle ]; then
            echo "dir=ShinobiCraft-Forge-1.20.1" >> "$GITHUB_OUTPUT"
            echo "Using ShinobiCraft-Forge-1.20.1/"
          else
            # Search one level deep for build.gradle
            FOUND=$(find . -maxdepth 2 -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "No build.gradle found"
              ls -la
              exit 1
            fi
            DIR=$(dirname "$FOUND")
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
            echo "Using $DIR"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Prepare Gradle
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "BUILD_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "No gradlew — using system Gradle 8.1.1"
            echo "BUILD_CMD=gradle" >> "$GITHUB_ENV"
          fi
          # Show layout so missing files are obvious in the log
          echo "Project files:"
          ls -la
          echo "Source tree (depth 3):"
          find src -maxdepth 3 -type d 2>/dev/null | head -40 || true

      - name: Build the mod
        working-directory: ${{ steps.root.outputs.dir }}
        run: ${{ env.BUILD_CMD }} build --no-daemon --stacktrace

      - name: Check the jar is real
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          ls -la build/libs
          JAR=$(ls build/libs/*.jar | grep -v -e sources -e slim -e javadoc | head -n 1)
          SIZE=$(stat -c%s "$JAR")
          echo "$JAR is $SIZE bytes"
          if [ "$SIZE" -lt 200000 ]; then
            echo "Jar is too small, the build is broken"
            exit 1
          fi

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: shinobicraft-jar
          path: |
            ${{ steps.root.outputs.dir }}/build/libs/*.jar
            !${{ steps.root.outputs.dir }}/build/libs/*-sources.jar
            !${{ steps.root.outputs.dir }}/build/libs/*-slim.jar
            !${{ steps.root.outputs.dir }}/build/libs/*-javadoc.jar

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            ${{ steps.root.outputs.dir }}/build/reports
            ${{ steps.root.outputs.dir }}/build/tmp
